[package]
name = "want-wallpapers-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
totp-rs = "5.7"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
ipnet = "2"
url = "2"
tower-http = { version = "0.6", features = ["fs", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = "0.3"
google-cloud-recaptchaenterprise-v1 = { version = "=1.12.0", default-features = false }
google-cloud-gax = { version = "1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
