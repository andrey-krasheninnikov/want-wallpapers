name: Production deployment
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Protected annotated release tag; select this same tag as the workflow ref
        required: true
        type: string
      profile:
        description: Verification profile (full runs every check)
        required: true
        default: full
        type: choice
        options: [full]
      index_digest:
        description: Original immutable digest for a retry; leave empty to build a new release
        required: false
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  guard:
    if: github.repository == 'andrey-krasheninnikov/want-wallpapers'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject non-release deployment requests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VERIFICATION_PROFILE: ${{ inputs.profile }}
          INPUT_DIGEST: ${{ inputs.index_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci-release.py guard --tag "$RELEASE_TAG" --digest "$INPUT_DIGEST" > "$RUNNER_TEMP/release-request.json"
          jq -r '"Profile: \(.verificationProfile)\nSkipped checks: \(.skippedChecks | join(", "))"' "$RUNNER_TEMP/release-request.json" >> "$GITHUB_STEP_SUMMARY"
  checks:
    needs: guard
    if: inputs.index_digest == ''
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/checks.yml
    with:
      tag: ${{ inputs.tag }}
      profile: ${{ inputs.profile }}
  eligibility:
    needs: [guard, checks]
    if: >-
      !cancelled() && needs.guard.result == 'success' &&
      (needs.checks.result == 'success' || (inputs.index_digest != '' && needs.checks.result == 'skipped'))
    uses: ./.github/workflows/release-gate.yml
    with:
      tag: ${{ inputs.tag }}
      profile: ${{ inputs.profile }}
      index_digest: ${{ inputs.index_digest || needs.checks.outputs.index_digest }}
  deploy:
    needs: eligibility
    if: ${{ !cancelled() && needs.eligibility.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production
    concurrency:
      group: want-wallpapers-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Deploy exact verified release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ needs.eligibility.outputs.source_sha }}
          RELEASE_DIGEST: ${{ needs.eligibility.outputs.index_digest }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          python3 scripts/deploy-client.py deploy --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --digest "$RELEASE_DIGEST" > "$RUNNER_TEMP/deployment.json"
      - name: Deployment record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment.json
          if-no-files-found: ignore
          retention-days: 90
