name: Checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  verify:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      full: ${{ steps.selection.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select verification mode
        id: selection
        run: |
          python3 scripts/ci-release.py plan > "$RUNNER_TEMP/ci-plan.json"
          jq -r '"full=\(.full)"' "$RUNNER_TEMP/ci-plan.json" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Install dependencies
        run: make install
      - name: Static checks
        run: make check
      - name: PostgreSQL 18 and application tests
        timeout-minutes: 10
        run: make test
      - name: Dependency audit
        if: steps.selection.outputs.full == 'true'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          make audit
  ui:
    name: Full UI
    needs: verify
    if: >-
      github.repository == 'andrey-krasheninnikov/want-wallpapers' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.verify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Install dependencies
        run: make install
      - name: Install browser
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Enable sandbox for the installed Playwright browsers
        run: |
          TASK_PROFILE="$RUNNER_TEMP/want-playwright-apparmor"
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' > "$TASK_PROFILE"
          COUNT=0
          while IFS= read -r -d '' BROWSER; do
            printf '\nprofile want-playwright-%s "%s" flags=(unconfined) {\n  userns,\n}\n' "$COUNT" "$BROWSER" >> "$TASK_PROFILE"
            COUNT=$((COUNT + 1))
          done < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell \) -print0)
          test "$COUNT" -gt 0
          sudo install -m 644 "$TASK_PROFILE" /etc/apparmor.d/want-playwright
          sudo apparmor_parser --replace /etc/apparmor.d/want-playwright
          sysctl kernel.apparmor_restrict_unprivileged_userns
          cd frontend
          bun -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch({ chromiumSandbox: true }); await browser.close(); console.log('Chromium sandbox smoke: OK');"
      - name: Build and browser tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-ui
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-results
          path: ${{ runner.temp }}/want-wallpapers-ui
          retention-days: 7
          if-no-files-found: ignore
  containers:
    name: Runtime (${{ matrix.arch }})
    if: >-
      github.repository == 'andrey-krasheninnikov/want-wallpapers' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID || 'want-wallpapers' }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.PUBLIC_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Build and identify the native runtime image
        run: |
          make docker-build
          docker image inspect want-wallpapers:local --format '{{json .}}' > "$RUNNER_TEMP/checked-image.json"
      - name: Production image and PostgreSQL 18 TLS
        run: make test-container
      - name: Save the checked image
        run: docker save want-wallpapers:local --output "$RUNNER_TEMP/runtime-image.tar"
      - name: Checked image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-image.tar
            ${{ runner.temp }}/checked-image.json
          retention-days: 1
          if-no-files-found: error
  publish-platforms:
    name: Publish (${{ matrix.arch }})
    needs: [verify, ui, containers]
    if: >-
      github.repository == 'andrey-krasheninnikov/want-wallpapers' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: runtime-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Push the checked native image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          REFERENCE="$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load --input "$RUNNER_TEMP/runtime-image.tar"
          python3 scripts/ci-release.py image --checked "$RUNNER_TEMP/checked-image.json" --arch "$ARCH"
          docker tag want-wallpapers:local "$REFERENCE"
          docker push "$REFERENCE"
          python3 scripts/ci-release.py image --checked "$RUNNER_TEMP/checked-image.json" --arch "$ARCH" --reference "$REFERENCE" > "$RUNNER_TEMP/$ARCH.json"
      - name: Platform publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [verify, ui, containers, publish-platforms]
    if: >-
      github.repository == 'andrey-krasheninnikov/want-wallpapers' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: platform-*-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/platforms
      - name: Publish the verified OCI index and durable release record
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          REFERENCE="$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/ci-release.py record --platform-directory "$RUNNER_TEMP/platforms" > "$RUNNER_TEMP/release-record.json"
          AMD64="$(jq -r '.platforms["linux/amd64"].digest' "$RUNNER_TEMP/release-record.json")"
          ARM64="$(jq -r '.platforms["linux/arm64"].digest' "$RUNNER_TEMP/release-record.json")"
          docker buildx imagetools create --tag "$REFERENCE" \
            --annotation "index:foundation.want.wallpapers.release.v1=$(cat "$RUNNER_TEMP/release-record.json")" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          DIGEST="$(docker buildx imagetools inspect "$REFERENCE" --format '{{.Manifest.Digest}}')"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$RUNNER_TEMP/runtime-manifest.json"
          jq --exit-status '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]' "$RUNNER_TEMP/runtime-manifest.json"
          jq --arg digest "$DIGEST" --arg image "$IMAGE@$DIGEST" '. + {indexDigest: $digest, image: $image}' "$RUNNER_TEMP/release-record.json" > "$RUNNER_TEMP/published-release.json"
          printf 'APP_IMAGE=%s@%s\nSource: %s\nRun: %s attempt %s\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - name: Release record copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-record-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-release.json
          retention-days: 90
          if-no-files-found: error
