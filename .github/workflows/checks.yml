name: Checks
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      profile:
        type: string
        default: full
    outputs:
      source_sha:
        value: ${{ jobs.publish.outputs.source_sha }}
      index_digest:
        value: ${{ jobs.publish.outputs.index_digest }}
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ inputs.tag }}
  VERIFICATION_PROFILE: ${{ inputs.profile || 'full' }}
jobs:
  selection:
    name: Release profile (${{ inputs.profile || 'full' }})
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.selection.outputs.checks }}
      full: ${{ steps.selection.outputs.full }}
      publish: ${{ steps.selection.outputs.publish }}
      ui: ${{ steps.selection.outputs.ui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select verification mode
        id: selection
        run: |
          python3 scripts/ci-release.py plan > "$RUNNER_TEMP/ci-plan.json"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/ci-plan.json" >> "$GITHUB_OUTPUT"
  verify:
    needs: selection
    if: needs.selection.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Install dependencies
        run: make install
      - name: Install backup and SSH test tools
        run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends age openssh-server ffmpeg
      - name: Static checks
        run: make check
      - name: PostgreSQL 18 and application tests
        timeout-minutes: 10
        run: make test
      - name: Dependency audit
        if: needs.selection.outputs.full == 'true'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          make audit
  drafts:
    name: Collection drafts
    needs: selection
    if: needs.selection.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: make test-generation
  ui:
    name: Full UI
    needs: [selection, verify]
    if: needs.selection.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Install dependencies
        run: make install
      - name: Install media validation tools
        run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install browser
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Enable sandbox for the installed Playwright browsers
        run: |
          TASK_PROFILE="$RUNNER_TEMP/want-playwright-apparmor"
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' > "$TASK_PROFILE"
          COUNT=0
          while IFS= read -r -d '' BROWSER; do
            printf '\nprofile want-playwright-%s "%s" flags=(unconfined) {\n  userns,\n}\n' "$COUNT" "$BROWSER" >> "$TASK_PROFILE"
            COUNT=$((COUNT + 1))
          done < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell \) -print0)
          test "$COUNT" -gt 0
          sudo install -m 644 "$TASK_PROFILE" /etc/apparmor.d/want-playwright
          sudo apparmor_parser --replace /etc/apparmor.d/want-playwright
          sysctl kernel.apparmor_restrict_unprivileged_userns
          cd frontend
          bun -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch({ chromiumSandbox: true }); await browser.close(); console.log('Chromium sandbox smoke: OK');"
      - name: Build and browser tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-ui
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-results
          path: ${{ runner.temp }}/want-wallpapers-ui
          retention-days: 7
          if-no-files-found: ignore
  containers:
    name: Runtime (${{ matrix.arch }})
    needs: selection
    if: needs.selection.outputs.full == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID || 'want-wallpapers' }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.PUBLIC_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Build and identify the native runtime image
        run: |
          make docker-build
          docker image inspect want-wallpapers:local --format '{{json .}}' > "$RUNNER_TEMP/checked-image.json"
      - name: Production image and PostgreSQL 18 TLS
        run: make test-container
      - name: Save the checked image
        run: docker save want-wallpapers:local --output "$RUNNER_TEMP/runtime-image.tar"
      - name: Checked image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-image.tar
            ${{ runner.temp }}/checked-image.json
          retention-days: 1
          if-no-files-found: error
  publish-platforms:
    name: Publish (${{ matrix.arch }})
    needs: [selection, verify, drafts, ui, containers]
    if: needs.selection.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: runtime-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Push the checked native image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          REFERENCE="$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load --input "$RUNNER_TEMP/runtime-image.tar"
          python3 scripts/ci-release.py image --checked "$RUNNER_TEMP/checked-image.json" --arch "$ARCH"
          docker tag want-wallpapers:local "$REFERENCE"
          docker push "$REFERENCE"
          python3 scripts/ci-release.py image --checked "$RUNNER_TEMP/checked-image.json" --arch "$ARCH" --reference "$REFERENCE" > "$RUNNER_TEMP/$ARCH.json"
      - name: Platform publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.json
          retention-days: 1
          if-no-files-found: error
  publish:
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      index_digest: ${{ steps.release.outputs.index_digest }}
    needs: [selection, verify, drafts, ui, containers, publish-platforms]
    if: needs.selection.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: platform-*-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/platforms
      - name: Publish the verified OCI index and durable release record
        id: release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/ci-release.py record --platform-directory "$RUNNER_TEMP/platforms" > "$RUNNER_TEMP/release-record.json"
          python3 scripts/ci-release.py publish-index --record "$RUNNER_TEMP/release-record.json" > "$RUNNER_TEMP/published-release.json"
          DIGEST="$(jq -r .indexDigest "$RUNNER_TEMP/published-release.json")"
          jq -r '"source_sha=\(.sourceSha)", "index_digest=\(.indexDigest)"' "$RUNNER_TEMP/published-release.json" >> "$GITHUB_OUTPUT"
          printf 'APP_IMAGE=%s@%s\nSource: %s\nRun: %s attempt %s\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - name: Release record copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-record-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-release.json
          retention-days: 90
          if-no-files-found: error
