name: Checks
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Install dependencies
        run: make install
      - name: Dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          make audit
      - name: Static checks
        run: make check
      - name: PostgreSQL 18 and application tests
        run: make test
      - name: Install browser
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Build and browser tests
        run: make test-ui
      - name: Container build
        run: make docker-build
      - name: Production image and PostgreSQL TLS
        run: make test-container
      - name: Browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-results
          path: /tmp/want-wallpapers-ui
          retention-days: 7
