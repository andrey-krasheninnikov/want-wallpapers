name: Checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [development, main, feature/vps-traefik-deployment, feature/rust-backend-monorepo]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Install dependencies
        run: make install
      - name: Dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          make audit
      - name: Static checks
        run: make check
      - name: PostgreSQL 18 and application tests
        run: make test
      - name: Install browser
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Enable sandbox for the installed Playwright browsers
        run: |
          TASK_PROFILE="$RUNNER_TEMP/want-playwright-apparmor"
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' > "$TASK_PROFILE"
          COUNT=0
          while IFS= read -r -d '' BROWSER; do
            printf '\nprofile want-playwright-%s "%s" flags=(unconfined) {\n  userns,\n}\n' "$COUNT" "$BROWSER" >> "$TASK_PROFILE"
            COUNT=$((COUNT + 1))
          done < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell \) -print0)
          test "$COUNT" -gt 0
          sudo install -m 644 "$TASK_PROFILE" /etc/apparmor.d/want-playwright
          sudo apparmor_parser --replace /etc/apparmor.d/want-playwright
          sysctl kernel.apparmor_restrict_unprivileged_userns
          cd frontend
          bun -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch({ chromiumSandbox: true }); await browser.close(); console.log('Chromium sandbox smoke: OK');"
      - name: Build and browser tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: make test-ui
      - name: Container build
        run: make docker-build
      - name: Production image and PostgreSQL TLS
        run: make test-container
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-results
          path: ${{ runner.temp }}/want-wallpapers-ui
          retention-days: 7
          if-no-files-found: ignore
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/vps-traefik-deployment')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and push the runtime image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID || 'want-wallpapers' }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg PUBLIC_FIREBASE_API_KEY \
            --build-arg PUBLIC_FIREBASE_PROJECT_ID \
            --build-arg PUBLIC_FIREBASE_APP_ID \
            --build-arg PUBLIC_FIREBASE_MEASUREMENT_ID \
            --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
