name: Verify and publish VPS image

on:
  push:
    branches: [main, feature/vps-traefik-deployment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies and test tools
        run: |
          bun install --frozen-lockfile
          npm install --global firebase-tools@15.32.1
          bunx --bun playwright install --with-deps chromium
          cp .env.example .env
      - name: Check, test and build all images
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bun run sync:previews
          bun run check
          bun test tests/catalog-search.test.ts tests/search-filters.test.ts
          firebase emulators:exec --project demo-want-wallpapers --only firestore 'bun test tests/catalog-add.test.ts && bun run test:rules'
          bun run test:ui
          bunx --bun astro build
          EXPECTED_IMAGES="$(bun -e "import { wallpapers } from './src/data/catalog'; console.log(wallpapers.length * 2)")"
          test "$(find dist/downloads -name '*.png' -type f | wc -l)" -eq "$EXPECTED_IMAGES"
          test "$(find dist/previews -name '*.webp' -type f | wc -l)" -eq "$EXPECTED_IMAGES"
          du -sh dist
      - name: Upload UI verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-verification
          path: |
            ${{ runner.temp }}/want-wallpapers-ui/results
            ${{ runner.temp }}/want-wallpapers-ui/report
          retention-days: 7
          if-no-files-found: ignore
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/vps-traefik-deployment')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and push the pinned runtime image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.PUBLIC_FIREBASE_MEASUREMENT_ID }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.PUBLIC_RECAPTCHA_SITE_KEY }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull \
            --build-arg PUBLIC_FIREBASE_MEASUREMENT_ID \
            --build-arg PUBLIC_RECAPTCHA_SITE_KEY \
            --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io