services:
  n8n:
    cpus: 1.0
    mem_limit: 1g
    environment:
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
  draft-store:
    build:
      context: ../..
      dockerfile: automation/n8n/draft.Dockerfile
    image: want-wallpapers-draft-store:local
    cpus: 1.0
    mem_limit: 768m
    user: '1000:1000'
    restart: unless-stopped
    stop_grace_period: 90s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DRAFT_STORE_DIRECTORY: /state
      DRAFT_FORM_ORIGIN: http://localhost:${N8N_PORT:-5678}
    volumes:
      - type: volume
        source: data
        target: /state
        volume:
          subpath: generation
    tmpfs:
      - /tmp:mode=1777,size=16m
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:8091/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging:
      driver: local
      options:
        max-size: '5m'
        max-file: '3'
