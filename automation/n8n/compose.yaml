name: want-wallpapers-n8n
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.7@sha256:bcef56dd44014e09774219536a3f8cb07f1b553fcba94044bd9fc0f21f8676a3
    user: '1000:1000'
    restart: unless-stopped
    stop_grace_period: 90s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '127.0.0.1:${N8N_PORT:-5678}:5678'
    environment:
      TZ: Europe/Moscow
      GENERIC_TIMEZONE: Europe/Moscow
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}
      N8N_SECURE_COOKIE: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_LOG_LEVEL: warn
      DB_TYPE: sqlite
      DB_SQLITE_POOL_SIZE: '2'
      EXECUTIONS_MODE: regular
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'true'
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'true'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '336'
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: '10000'
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: '60'
    volumes:
      - data:/home/node/.n8n
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:5678/healthz/readiness', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1)).setTimeout(3000, function () { this.destroy(); process.exit(1); })"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging:
      driver: local
      options:
        max-size: '5m'
        max-file: '3'
volumes:
  data:
    name: ${N8N_DATA_VOLUME:-want-wallpapers-n8n-data}
