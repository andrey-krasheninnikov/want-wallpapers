worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    log_format minimal escape=json
        '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent}';
    access_log /dev/stdout minimal;

    map $uri $cache_control {
        default "public, max-age=0, must-revalidate";
        ~^/_astro/ "public, max-age=31536000, immutable";
        ~^/previews/ "public, max-age=604800";
    }

    map $uri $download_disposition {
        default "";
        ~^/downloads/ "attachment";
    }

    server {
        listen 8080;
        server_name wallpapers.want.foundation;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 /404.html;
        add_header Cache-Control $cache_control always;
        add_header Content-Disposition $download_disposition always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google.com https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://*.google-analytics.com https://ipwho.is; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://*.firebaseapp.com https://www.google.com https://www.recaptcha.net" always;

        location = /healthz {
            access_log off;
            return 204;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location = /404.html {
            internal;
        }

        location ~ (^|/)\. {
            return 404;
        }
    }
}