name: want-wallpapers
services:
  wallpapers:
    image: ${WALLPAPERS_IMAGE:?Set WALLPAPERS_IMAGE to the verified GHCR image digest}
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.5
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: wallpapers-proxy